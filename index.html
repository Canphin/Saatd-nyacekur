<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gerçek Zamanlı Kıble Bulucu</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 20px 16px 40px;
    overflow-x: hidden;
  }
  h1 { font-size: 1.4rem; margin-bottom: 6px; color: #22d3ee; text-align: center; }
  .subtitle { font-size: 0.8rem; color: #94a3b8; margin-bottom: 20px; text-align: center; }

  .permission-card {
    width: 100%;
    max-width: 340px;
    background: linear-gradient(135deg, rgba(34,211,238,.1), rgba(167,139,250,.1));
    border: 1px solid rgba(34,211,238,.4);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
    text-align: center;
  }
  .permission-card h2 {
    font-size: 0.95rem;
    color: #22d3ee;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .permission-card p {
    font-size: 0.82rem;
    color: #cbd5e1;
    line-height: 1.5;
    margin-bottom: 14px;
  }
  .permission-card.hidden { display: none; }

  .btn {
    display: block;
    width: 100%;
    padding: 14px 20px;
    background: linear-gradient(135deg, #22d3ee, #06b6d4);
    color: #0f172a;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    margin-bottom: 8px;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.97); }
  .btn.secondary {
    background: transparent;
    color: #94a3b8;
    border: 1px solid #334155;
    font-weight: 600;
    font-size: 0.85rem;
    padding: 10px;
  }

  .compass-container {
    position: relative;
    width: 280px;
    height: 280px;
    margin: 16px 0;
  }

  .compass-body {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
    border: 3px solid #334155;
    transition: transform 0.08s linear;
    z-index: 1;
    box-shadow: inset 0 0 40px rgba(34,211,238,.08), 0 8px 30px rgba(0,0,0,.4);
    will-change: transform;
  }

  .compass-body .tick {
    position: absolute;
    top: 4px;
    left: 50%;
    width: 2px;
    height: 8px;
    background: #334155;
    transform-origin: 50% 136px;
    transform: translateX(-50%) rotate(var(--deg));
  }
  .compass-body .tick.major { height: 16px; width: 3px; background: #475569; }

  .dir {
    position: absolute;
    font-weight: 900;
    font-size: 1rem;
    color: #94a3b8;
  }
  .dir.n { top: 12px; left: 50%; transform: translateX(-50%); color: #ef4444; }
  .dir.s { bottom: 12px; left: 50%; transform: translateX(-50%); }
  .dir.e { right: 12px; top: 50%; transform: translateY(-50%); }
  .dir.w { left: 12px; top: 50%; transform: translateY(-50%); }

  .qibla-needle {
    position: absolute;
    inset: 0;
    transform-origin: center;
    transition: transform 0.4s cubic-bezier(.34,1.56,.64,1);
    z-index: 2;
    pointer-events: none;
    will-change: transform;
  }
  .qibla-needle .arrow {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-bottom: 70px solid #22c55e;
    filter: drop-shadow(0 0 12px rgba(34,197,94,.9));
  }
  .qibla-needle .kaaba-icon {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.6rem;
    line-height: 1;
    filter: drop-shadow(0 0 8px rgba(34,197,94,.6));
  }

  .center-dot {
    position: absolute;
    top: 50%; left: 50%;
    width: 16px; height: 16px;
    margin: -8px 0 0 -8px;
    background: #22d3ee;
    border-radius: 50%;
    box-shadow: 0 0 20px #22d3ee;
    z-index: 3;
  }

  .qibla-info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: 100%;
    max-width: 340px;
    margin-top: 8px;
  }
  .info-item {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 10px 6px;
    text-align: center;
  }
  .info-item .label {
    font-size: 0.6rem;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 3px;
  }
  .info-item .value {
    font-size: 1.05rem;
    font-weight: 800;
    color: #22d3ee;
    font-variant-numeric: tabular-nums;
  }

  .message {
    width: 100%;
    max-width: 340px;
    margin-top: 14px;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 0.9rem;
    font-weight: 700;
    text-align: center;
    background: #1e293b;
    border: 1px solid #334155;
    transition: all 0.3s;
  }
  .message.aligned { background: rgba(34,197,94,.15); border-color: #22c55e; color: #22c55e; }
  .message.close { background: rgba(234,179,8,.15); border-color: #eab308; color: #eab308; }
  .message.far { background: rgba(239,68,68,.15); border-color: #ef4444; color: #ef4444; }

  .status-row {
    width: 100%;
    max-width: 340px;
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 0.75rem;
    color: #64748b;
  }
  .status-row .row {
    display: flex;
    justify-content: space-between;
    padding: 6px 10px;
    background: rgba(30,41,59,.6);
    border-radius: 6px;
  }
  .status-row .ok { color: #4ade80; }
  .status-row .warn { color: #fbbf24; }
  .status-row .err { color: #f87171; }

  .log-panel {
    width: 100%;
    max-width: 340px;
    margin-top: 12px;
    padding: 10px;
    background: #0a0f1e;
    border: 1px solid #1e293b;
    border-radius: 8px;
    font-family: ui-monospace, monospace;
    font-size: 0.68rem;
    color: #64748b;
    max-height: 120px;
    overflow-y: auto;
    line-height: 1.5;
  }
  .log-panel .log-line { padding: 1px 0; }
  .log-panel .log-line.info { color: #22d3ee; }
  .log-panel .log-line.err { color: #f87171; }
  .log-panel .log-line.ok { color: #4ade80; }
  .log-panel .log-line.warn { color: #fbbf24; }
</style>
</head>
<body>

<h1>🧭 Kıble Bulucu</h1>
<p class="subtitle">Gerçek zamanlı yön tespiti</p>

<div class="permission-card" id="permissionCard">
  <h2>Başlamak için izin gerekli</h2>
  <p id="permText">
    Kıble yönünü göstermek için konumunuza ve cihaz pusulasına erişmemiz gerekiyor.
  </p>
  <button class="btn" id="startBtn">📡 Pusulayı Başlat</button>
  <button class="btn secondary" id="skipBtn">Konum olmadan devam et</button>
</div>

<div class="compass-container" id="compassContainer" style="display:none;">
  <div class="compass-body" id="compassBody">
    <div class="dir n">N</div>
    <div class="dir s">S</div>
    <div class="dir e">E</div>
    <div class="dir w">W</div>
  </div>
  <div class="qibla-needle" id="qiblaNeedle">
    <div class="arrow"></div>
    <div class="kaaba-icon">🕋</div>
  </div>
  <div class="center-dot"></div>
</div>

<div class="qibla-info" id="qiblaInfo" style="display:none;">
  <div class="info-item">
    <div class="label">Kıble</div>
    <div class="value" id="qiblaAngleEl">--°</div>
  </div>
  <div class="info-item">
    <div class="label">Cihaz</div>
    <div class="value" id="deviceHeadingEl">--°</div>
  </div>
  <div class="info-item">
    <div class="label">Fark</div>
    <div class="value" id="diffEl">--°</div>
  </div>
</div>

<div class="message" id="messageBox" style="display:none;">Hazırlanıyor…</div>

<div class="status-row" id="statusRow" style="display:none;">
  <div class="row"><span>📍 Konum</span><span id="statusLoc">bekliyor</span></div>
  <div class="row"><span>🧭 Pusula</span><span id="statusSensor">bekliyor</span></div>
  <div class="row"><span>🔒 HTTPS</span><span id="statusHttps">—</span></div>
</div>

<div class="log-panel" id="logPanel"></div>

<script>
(function() {
  'use strict';

  // ============================================================
  // SABİTLER
  // ============================================================
  const KAABA = { lat: 21.4225, lon: 39.8262 };
  const DEFAULT_LAT = 41.0082;
  const DEFAULT_LON = 28.9784;

  // 🔥 YUMUŞATMA KATSAYISI (düşürüldü: 0.12 → 0.04)
  const SMOOTHING = 0.04;

  // ============================================================
  // DURUM
  // ============================================================
  let userLat = DEFAULT_LAT;
  let userLon = DEFAULT_LON;
  let qiblaBearing = 0;
  let deviceHeading = 0;
  let smoothedHeading = 0;
  let hasSmoothed = false;
  let lastUpdate = 0;
  let sensorEventCount = 0;
  let sensorActive = false;
  let compassStarted = false;
  let lastRenderTime = 0;

  // Tercih: absolute olay mı geldi?
  let preferredSource = 'none';

  // ============================================================
  // LOG
  // ============================================================
  function log(msg, type) {
    const panel = document.getElementById('logPanel');
    if (!panel) return;
    const line = document.createElement('div');
    line.className = 'log-line' + (type ? ' ' + type : '');
    const time = new Date().toLocaleTimeString('tr-TR', { hour12: false });
    line.textContent = '[' + time + '] ' + msg;
    panel.appendChild(line);
    panel.scrollTop = panel.scrollHeight;
    console.log('[KIBLE]', msg);
  }

  const $ = (id) => document.getElementById(id);

  // ============================================================
  // HTTPS KONTROLÜ
  // ============================================================
  function checkHttps() {
    const isHttps = location.protocol === 'https:';
    const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    const isFile = location.protocol === 'file:';
    const secure = isHttps || isLocalhost;

    const el = $('statusHttps');
    if (el) {
      if (secure) { el.textContent = '✓ güvenli'; el.className = 'ok'; }
      else if (isFile) { el.textContent = '⚠ file://'; el.className = 'err'; }
      else { el.textContent = '⚠ HTTP'; el.className = 'err'; }
    }
    return secure;
  }

  // ============================================================
  // KIBLE AÇISI
  // ============================================================
  function calculateQibla(lat, lon) {
    const phi1 = lat * Math.PI / 180;
    const phi2 = KAABA.lat * Math.PI / 180;
    const dLambda = (KAABA.lon - lon) * Math.PI / 180;
    const y = Math.sin(dLambda);
    const x = Math.cos(phi1) * Math.tan(phi2) - Math.sin(phi1) * Math.cos(dLambda);
    let bearing = Math.atan2(y, x) * 180 / Math.PI;
    return (bearing + 360) % 360;
  }

  // ============================================================
  // KONUM İZNİ
  // ============================================================
  function requestLocation() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) {
        log('Konum desteklenmiyor', 'err');
        $('statusLoc').textContent = 'yok';
        $('statusLoc').className = 'err';
        resolve(false);
        return;
      }
      $('statusLoc').textContent = 'izin bekleniyor…';
      $('statusLoc').className = 'warn';
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLat = pos.coords.latitude;
          userLon = pos.coords.longitude;
          $('statusLoc').textContent = userLat.toFixed(2) + ', ' + userLon.toFixed(2);
          $('statusLoc').className = 'ok';
          log('Konum: ' + userLat.toFixed(4) + ', ' + userLon.toFixed(4), 'ok');
          resolve(true);
        },
        (err) => {
          $('statusLoc').textContent = 'reddedildi';
          $('statusLoc').className = 'err';
          log('Konum hatası: ' + err.message + ' — İstanbul varsayılan', 'err');
          resolve(false);
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
      );
    });
  }

  // ============================================================
  // YUMUŞATMA (LOW-PASS FİLTRE) — 0° / 360° SARMASI DÜZELTİLMİŞ
  // ============================================================
  function smoothHeading(newHeading) {
    if (!hasSmoothed) {
      smoothedHeading = newHeading;
      hasSmoothed = true;
      return smoothedHeading;
    }
    let diff = newHeading - smoothedHeading;
    if (diff > 180) diff -= 360;
    if (diff < -180) diff += 360;

    // 🔥 Çok büyük sıçramaları yok say (sensör parazit)
    if (Math.abs(diff) > 60) {
      // Ani sıçrama → hafif güncelle, tamamen atla değil
      smoothedHeading = smoothedHeading + diff * 0.5;
    } else {
      smoothedHeading = smoothedHeading + diff * SMOOTHING;
    }
    smoothedHeading = ((smoothedHeading % 360) + 360) % 360;
    return smoothedHeading;
  }

  // ============================================================
  // SENSÖR DİNLEYİCİ
  // ============================================================
  function extractHeading(event) {
    // iOS Safari
    if (event.webkitCompassHeading != null && !isNaN(event.webkitCompassHeading)) {
      return { heading: event.webkitCompassHeading, source: 'webkit' };
    }
    // Android
    if (event.alpha != null && !isNaN(event.alpha)) {
      const heading = (360 - event.alpha) % 360;
      return { heading: heading, source: event.absolute ? 'alpha-absolute' : 'alpha-relative' };
    }
    return null;
  }

  // 🔥 ABSOLUTE OLAY ÖNCELİKLİ
  function onAbsolute(event) {
    const r = extractHeading(event);
    if (r) {
      if (preferredSource !== 'alpha-absolute' && preferredSource !== 'webkit') {
        log('Absolute sensör aktif', 'ok');
      }
      preferredSource = 'alpha-absolute';
      handleHeading(r.heading);
    }
  }

  // Yedek olay
  function onRegular(event) {
    // Absolute zaten çalışıyorsa yedek olayı yok say
    if (preferredSource === 'alpha-absolute' || preferredSource === 'webkit') return;
    const r = extractHeading(event);
    if (r) {
      if (preferredSource === 'none') {
        log('Göreceli sensör aktif (absolute bulunamadı)', 'warn');
      }
      preferredSource = r.source;
      handleHeading(r.heading);
    }
  }

  function handleHeading(rawHeading) {
    sensorEventCount++;
    if (sensorEventCount <= 5) {
      if (sensorEventCount === 1) log('İlk sensör verisi: ' + rawHeading.toFixed(1) + '°', 'ok');
      return;
    }
    if (!sensorActive) {
      sensorActive = true;
      $('statusSensor').textContent = 'aktif (' + preferredSource + ')';
      $('statusSensor').className = 'ok';
      log('Pusula aktif — ' + preferredSource, 'ok');
    }

    // 🔥 Yumuşatılmış veriyi kullan
    deviceHeading = smoothHeading(rawHeading);

    // 20 fps yeter
    const now = performance.now();
    if (now - lastUpdate < 50) return;
    lastUpdate = now;

    render();
  }

  // ============================================================
  // ÇİZİM
  // ============================================================
  function render() {
    const compassBody = $('compassBody');
    const qiblaNeedle = $('qiblaNeedle');
    const messageBox = $('messageBox');

    if (!compassBody || !qiblaNeedle) return;

    // Pusula gövdesini cihaz yönünün tersine döndür
    // Böylece kullanıcı döndükçe N harfi gerçek kuzeyi gösterir
    const bodyRotation = -deviceHeading;
    compassBody.style.transform = 'rotate(' + bodyRotation.toFixed(2) + 'deg)';

    // Kıble iğnesi: kıble açısı - cihaz yönü = ekranda görünecek açı
    // İğne her zaman kuzey referansına göre kıble açısında durur
    // Ama gövde zaten döndüğü için, iğneyi gövdeye göre ayarlamalıyız
    // Basit: iğneyi kıble açısında sabit tut + gövde dönüşünü telafi et
    const needleAngle = qiblaBearing;
    qiblaNeedle.style.transform = 'rotate(' + needleAngle.toFixed(2) + 'deg)';

    // Bilgi paneli
    $('qiblaAngleEl').textContent = qiblaBearing.toFixed(1) + '°';
    $('deviceHeadingEl').textContent = deviceHeading.toFixed(1) + '°';

    // Kıble ile cihaz arasındaki açı farkı (kullanıcı hangi tarafa dönmeli)
    let diff = (qiblaBearing - deviceHeading + 360) % 360;
    if (diff > 180) diff -= 360;
    const absDiff = Math.abs(diff);
    $('diffEl').textContent = absDiff.toFixed(0) + '°';

    // Mesaj
    messageBox.className = 'message';
    if (absDiff < 5) {
      messageBox.textContent = '✓ Kıblesiniz doğru';
      messageBox.classList.add('aligned');
    } else if (absDiff < 20) {
      messageBox.textContent = absDiff.toFixed(0) + '° ' + (diff > 0 ? 'sağa' : 'sola') + ' dönün — az kaldı';
      messageBox.classList.add('close');
    } else {
      messageBox.textContent = absDiff.toFixed(0) + '° ' + (diff > 0 ? 'sağa' : 'sola') + ' dönün';
      messageBox.classList.add('far');
    }
  }

  // ============================================================
  // PUSULAYI BAŞLAT
  // ============================================================
  async function startCompass(useLocation) {
    if (compassStarted) return;
    compassStarted = true;

    $('permissionCard').classList.add('hidden');
    $('compassContainer').style.display = 'block';
    $('qiblaInfo').style.display = 'grid';
    $('messageBox').style.display = 'block';
    $('statusRow').style.display = 'flex';

    checkHttps();

    if (useLocation) {
      await requestLocation();
    } else {
      $('statusLoc').textContent = 'atlandı (İstanbul)';
      $('statusLoc').className = 'warn';
    }

    qiblaBearing = calculateQibla(userLat, userLon);
    log('Kıble açısı: ' + qiblaBearing.toFixed(1) + '°', 'ok');

    $('qiblaNeedle').style.transform = 'rotate(' + qiblaBearing + 'deg)';

    $('statusSensor').textContent = 'başlatılıyor…';
    $('statusSensor').className = 'warn';

    // iOS izni
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const resp = await DeviceOrientationEvent.requestPermission();
        if (resp === 'granted') {
          log('iOS izni verildi', 'ok');
          // iOS'ta absolute olayı genelde ateşlenmez, webkitCompassHeading kullan
          window.addEventListener('deviceorientationabsolute', onAbsolute, true);
          window.addEventListener('deviceorientation', onRegular, true);
          // iOS'ta hemen preferredSource = webkit yap ki regular kabul edilsin
          preferredSource = 'webkit';
        } else {
          log('iOS izni REDDEDİLDİ — Ayarlar > Safari > Hareket ve Yönelim', 'err');
          $('statusSensor').textContent = 'izin reddedildi';
          $('statusSensor').className = 'err';
          return;
        }
      } catch (e) {
        log('iOS izin hatası: ' + e.message, 'err');
        $('statusSensor').textContent = 'izin hatası';
        $('statusSensor').className = 'err';
        return;
      }
    } else {
      // Android / masaüstü
      log('Android modu — absolute öncelikli', 'info');
      window.addEventListener('deviceorientationabsolute', onAbsolute, true);
      window.addEventListener('deviceorientation', onRegular, true);
      window.addEventListener('compassneedscalibration', function () {
        log('Pusula kalibrasyon gerekiyor — telefonu 8 çizerek hareket ettirin', 'warn');
      }, true);
    }

    // 5 saniyede sensör gelmezse
    setTimeout(() => {
      if (!sensorActive) {
        log('5 saniye içinde sensör verisi gelmedi', 'err');
        $('statusSensor').textContent = 'sinyal yok';
        $('statusSensor').className = 'err';
        $('messageBox').textContent = '⚠ Pusula yanıt vermiyor — telefonu 8 çizerek kalibre et';
        $('messageBox').className = 'message far';
      }
    }, 5000);
  }

  // ============================================================
  // OLAYLAR
  // ============================================================
  $('startBtn').addEventListener('click', () => startCompass(true));
  $('skipBtn').addEventListener('click', () => startCompass(false));

  log('Sayfa hazır', 'info');
  checkHttps();

})();
</script>
</body>
</html>
